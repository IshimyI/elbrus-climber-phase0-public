<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Elbrus Climber</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/script.js" defer></script>
  </head>
  <body>
    <span class="rules">Z - вверх, X - вниз</span>
    <div class="container">
      <div class="mountain-wrapper">
        <div class="point" data-id="1"></div>
        <div class="point" data-id="2"></div>
        <div class="point" data-id="3"></div>
        <div class="point" data-id="4"></div>
        <div class="point" data-id="5"></div>
        <div class="point" data-id="6"></div>
        <div class="point" data-id="7"></div>
        <div class="point" data-id="8"></div>
        <div class="point" data-id="9"></div>
        <div class="point" data-id="10"></div>
        <div class="point" data-id="11"></div>
        <div class="point" data-id="12"></div>
        <div class="point" data-id="13"></div>
        <div class="point" data-id="14"></div>
        <div class="point" data-id="15"></div>
        <div class="point" data-id="16"></div>
        <div class="point" data-id="17"></div>
        <div class="point" data-id="18"></div>
        <div class="point" data-id="19"></div>
        <div class="point" data-id="20"></div>
        <div class="point" data-id="21"></div>
        <div class="point" data-id="22"></div>
        <div class="point" data-id="23"></div>
        <div class="point" data-id="24"></div>
        <div class="point" data-id="25"></div>
        <div class="point" data-id="26"></div>
        <div class="point" data-id="27"></div>
        <div class="point" data-id="28"></div>
        <div class="point" data-id="29"></div>
        <div class="point" data-id="30"></div>
        <div class="point winner" data-id="31"></div>
        <input
          class="sign"
          placeholder="Нажми сюда и после на пробел чтобы успокоиться и начать игру"
        />
        <div class="win-win hidden">
          <img src="./img/win.gif" alt="Победа" />
        </div>
        <img
          class="mountain"
          src="./img/mountains.png"
          alt="Красивая картинка горы"
        />
        <img
          class="mountain mountain-bottom"
          src="./img/mountains bottom.png"
          alt="Красивая картинка горы"
        />
        <div class="climber-wrapper">
          <img
            class="climber dancing"
            src="./img/climber.png"
            alt="Красивая картинка скалолаза"
          />
        </div>
      </div>
    </div>
  </body>
</html>
